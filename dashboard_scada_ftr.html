  .notif-panel{

  .notif-panel.open{display:block;}
  .notif-panel-head{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;margin-bottom:10px;}

  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--kpi-accent,var(--teal));}
  .kpi-label{font-size:11.5px;color:var(--text-secondary);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  .kpi-value{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;margin:0;font-variant-numeric:tabular-nums;}
  .kpi-unit{font-size:12px;color:var(--text-muted);font-weight:400;margin-left:4px;}

  .chart-wrap{position:relative;height:260px;}

  .achieve-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
  .achieve-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
  .achieve-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}

  .achieve-pct{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
  .achieve-bar-track{background:var(--bg);border-radius:6px;height:10px;overflow:hidden;margin-bottom:10px;border:1px solid var(--border);}
  .achieve-bar-fill{height:100%;border-radius:6px;transition:width .5s,background-color .3s;}
  .achieve-status{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:5px;font-family:'IBM Plex Mono',monospace;}

  .slicer{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:4px;}

  .group-select{display:flex;gap:6px;flex-wrap:wrap;}

  .bar-val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-secondary);text-align:right;font-variant-numeric:tabular-nums;}

  .sticky-table-wrap thead th{

  .export-row{display:flex;gap:8px;margin:12px 0;}

  }

let DATA = EMBEDDED_DATA;
let JTM_DETAIL = null; // diisi setelah live fetch (breakdown_jtm, besar)
let MONTHS, MONTHS_LABEL;

// ---- Theme ----
let currentTheme = 'dark';
const THEME_COLORS = { dark:{grid:'#2A3448',tick:'#8D9AB5'}, light:{grid:'#DCE1EC',tick:'#5B6B85'} };
const themeToggleBtn = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');
function applyTheme(theme){
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  themeIcon.innerHTML = theme==='dark' ? '&#9789;' : '&#9728;';
  themeLabel.textContent = theme==='dark' ? 'Dark' : 'Light';
  const c = THEME_COLORS[theme];
  Object.values(chartInstances).forEach(chart=>{
    chart.options.scales.x.ticks.color = c.tick;
    chart.options.scales.x.grid.color = c.grid;
    chart.options.scales.y.ticks.color = c.tick;
    chart.options.scales.y.grid.color = c.grid;
    chart.options.plugins.legend.labels.color = c.tick;
    chart.update();
  });
}
themeToggleBtn.addEventListener('click', ()=> applyTheme(currentTheme==='dark'?'light':'dark'));

let activeMetric = 'scada';
let activeSub = {};
let selectedMonthIdx = {};
let groupBy = { jtm:'z', jtm_gt15:'z', jtm_lt15:'z' };
let chartInstances = {};

const tabsEl = document.getElementById('metricTabs');
const pagesEl = document.getElementById('pages');
const liveStatusEl = document.getElementById('liveStatus');

tabsEl.addEventListener('click', e=>{
  const btn = e.target.closest('.metric-tab');
  if(!btn) return;
  activeMetric = btn.dataset.metric;
  document.querySelectorAll('.metric-tab').forEach(b=>b.classList.toggle('active', b.dataset.metric===activeMetric));
  document.querySelectorAll('.metric-page').forEach(p=>p.classList.toggle('active', p.id==='page-'+activeMetric));
  ensureChart(activeMetric);
});

function metricByKey(key){ return METRICS.find(m=>m.key===key); }

function initDashboard(){
  MONTHS = DATA.months;
  MONTHS_LABEL = DATA.months_label || DATA.months;

  METRICS.forEach(m=>{
    if(!(m.key in selectedMonthIdx)) selectedMonthIdx[m.key] = MONTHS.length-1;
    if(!(m.key in activeSub)) activeSub[m.key] = m.subs[0].key;
  });

  Object.values(chartInstances).forEach(c=>{ try{c.destroy();}catch(e){} });
  chartInstances = {};

  tabsEl.innerHTML = METRICS.map(m=>
    '<button class="metric-tab'+(m.key===activeMetric?' active':'')+'" data-metric="'+m.key+'">'+m.label+'</button>'
  ).join('');

  pagesEl.innerHTML = METRICS.map(m=>buildMetricPage(m)).join('');

  METRICS.forEach(m=>{
    renderSlicer(m);
    renderKpi(m);
    renderAchieveOverview(m);
    renderSubTabs(m);
    m.subs.forEach(s=>renderSubContent(m,s));
  });
  updateNotifications();
  ensureChart(activeMetric);
}

function buildMetricPage(m){
  return '<div class="metric-page'+(m.key===activeMetric?' active':'')+'" id="page-'+m.key+'">'+

    '<section>'+
      '<div class="section-head"><h2>Pilih bulan</h2><div class="slicer" id="slicer-'+m.key+'"></div></div>'+
      '<div class="kpi-row" id="kpi-'+m.key+'"></div>'+
    '</section>'+

    '<section>'+
      '<div class="section-head"><h2 class="glow-heading" style="--glow-color:'+m.color+'">Tren kumulatif '+m.label+' &mdash; realisasi vs target</h2></div>'+
      '<div class="chart-wrap"><canvas id="chart-'+m.key+'"></canvas></div>'+
    '</section>'+

    '<section>'+
      '<div class="section-head"><h2>Komponen pembentuk '+m.label+'</h2></div>'+
      '<p class="subnote">Pencapaian tiap komponen bulan terpilih (kumulatif). Pencapaian gabungan di atas adalah hasil kombinasi ketiganya.</p>'+
      '<div class="achieve-row" id="achieve-overview-'+m.key+'"></div>'+
      (m.key==='scada' ? '<div id="component-detail-scada" style="margin-top:22px;"></div>' : '') +
    '</section>'+

    '<section>'+
      '<div class="section-head"><h2>Detail per sumber</h2><div class="sub-tabs" id="subtabs-'+m.key+'"></div></div>'+
      m.subs.map(s=>'<div class="sub-page'+(s.key===m.subs[0].key?' active':'')+'" id="subpage-'+m.key+'-'+s.key+'"></div>').join('') +
    '</section>'+

  '</div>';
}

function renderSlicer(m){
  const el = document.getElementById('slicer-'+m.key);
  el.innerHTML = MONTHS.map((mo,i)=>
    '<button class="slicer-btn'+(i===selectedMonthIdx[m.key]?' active':'')+'" data-idx="'+i+'">'+mo+'</button>'
  ).join('');
  el.querySelectorAll('.slicer-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedMonthIdx[m.key] = parseInt(btn.dataset.idx);
      renderAll(m.key);
    });
  });
}

function renderKpi(m){
  const idx = selectedMonthIdx[m.key];
  const combined = DATA.recap[m.key].combined[idx];
  const pct = combined.kumulatif*100;
  const targetPct = m.key==='ftr' ? 100 : (combined.target*100);
  const gap = pct - targetPct;
  const gapUp = gap >= 0;
  const gapColor = gapUp ? 'var(--green)' : 'var(--red)';
  const gapArrow = gapUp ? '&#9650;' : '&#9660;';
  const kpis = [
    {label:'Target', value:targetPct.toFixed(0), unit:'%', accent:'var(--text-secondary)'},
    {label:'Pencapaian', value:pct.toFixed(1), unit:'%', accent: pct>=100?'var(--green)':(pct>=90?'var(--amber)':'var(--red)')},
    {label:'GAP', value:(gapUp?'+':'')+gap.toFixed(1), unit:'%', accent:gapColor, arrow:gapArrow},
  ];
  document.getElementById('kpi-'+m.key).innerHTML = kpis.map(k=>
    '<div class="kpi" style="--kpi-accent:'+k.accent+'"><p class="kpi-label">'+k.label+'</p><p class="kpi-value">'+
    (k.arrow?'<span style="font-size:16px;margin-right:3px;">'+k.arrow+'</span>':'')+
    k.value+'<span class="kpi-unit">'+k.unit+'</span></p></div>'
  ).join('');
}

function baseBarColors(key){
  const m = metricByKey(key);
  const combined = DATA.recap[key].combined;
  return combined.map((c,i)=> i===selectedMonthIdx[key] ? m.color : m.color+'55');
}

function ensureChart(key){
  if(chartInstances[key]){ chartInstances[key].resize(); return; }
  const m = metricByKey(key);
  const combined = DATA.recap[key].combined;
  const ctx = document.getElementById('chart-'+key).getContext('2d');
  chartInstances[key] = new Chart(ctx, {
    data: {
      labels: MONTHS,
      datasets: [
        { type:'bar', label:'Kumulatif', data: combined.map(c=>c.kumulatif*100),
          backgroundColor: baseBarColors(key), borderRadius:4, order:2 },
        { type:'line', label:'Target', data: combined.map(c=> key==='ftr' ? 100 : c.target*100),
          borderColor:'#E5564F', borderDash:[5,4], pointRadius:0, borderWidth:2, tension:0, order:1 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      onClick: (evt, elements) => { if(elements.length){ selectedMonthIdx[key]=elements[0].index; renderAll(key);} },
      onHover: (evt, elements, chartRef) => {
        const barEl = elements.find(el => el.datasetIndex===0);
        const hoverIdx = barEl ? barEl.index : null;
        const base = baseBarColors(key);
        chartRef.data.datasets[0].backgroundColor = base.map((c,i)=>{
          if(hoverIdx===null) return c;
          return i===hoverIdx ? m.color : m.color+'1a';
        });
        chartRef.update('none');
      },
      plugins:{ legend:{labels:{color:'#8D9AB5',font:{family:'Inter',size:11}}}, tooltip:{mode:'index',intersect:false} },
      scales:{
        x:{ ticks:{color:THEME_COLORS[currentTheme].tick,font:{family:'IBM Plex Mono',size:10}}, grid:{color:THEME_COLORS[currentTheme].grid} },
        y:{ ticks:{color:THEME_COLORS[currentTheme].tick,font:{family:'IBM Plex Mono',size:10}}, grid:{color:THEME_COLORS[currentTheme].grid} }
      }
    }
  });
}
function updateChartHighlight(key){
  const chart = chartInstances[key]; if(!chart) return;
  chart.data.datasets[0].backgroundColor = baseBarColors(key);
  chart.update();
}

function achieveColorFor(pct){
  if(pct>=100) return {color:'var(--green)', bg:'var(--green-dim)', text:'Tercapai'};
  if(pct>=90) return {color:'var(--amber)', bg:'var(--amber-dim)', text:'Perlu Perhatian'};
  return {color:'var(--red)', bg:'var(--red-dim)', text:'Tidak Tercapai'};
}

function renderAchieveOverview(m){
  const idx = selectedMonthIdx[m.key];
  const combined = DATA.recap[m.key].combined[idx];
  let items;
  if(m.key==='scada'){
    items = [
      {label:'GI (Trafo Distribusi)', val: combined.ef_gi_td},
      {label:'GI (MW)', val: combined.ef_gi_mw},
      {label:'JTM All Zona (Trafo Distribusi)', val: combined.ef_jtm_td},
      {label:'JTM All Zona (MW)', val: combined.ef_jtm_mw},
      {label:'Kesiapan RC', val: combined.ef_kesiapan_rc},
    ];
  } else {
    items = [
      {label:'Gardu Induk', val: combined.gardu_induk},
      {label:'JTM > 1,5', val: combined.jtm_gt15},
      {label:'JTM < 1,5', val: combined.jtm_lt15},
    ];
  }
  document.getElementById('achieve-overview-'+m.key).innerHTML = items.map(it=>{
    const pct = it.val*100;
    const s = achieveColorFor(pct);
    return '<div class="achieve-card">'+
      '<div class="achieve-head"><span class="achieve-title">'+it.label+'</span><span class="achieve-pct" style="color:'+s.color+'">'+pct.toFixed(1)+'%</span></div>'+
      '<div class="achieve-bar-track"><div class="achieve-bar-fill" style="width:'+Math.min(pct,100).toFixed(1)+'%;background:'+s.color+'"></div></div>'+
      '<span class="achieve-status" style="color:'+s.color+';background:'+s.bg+'">'+s.text+'</span>'+
    '</div>';
  }).join('');

  if(m.key==='scada') renderComponentDetail(idx);
}

function componentDetailRow(label, le5, total, unit, slaTarget, precomputedPct){
  const pct = precomputedPct !== undefined ? precomputedPct : (total>0 ? (le5/total*100) : 0);
  const color = pct>=slaTarget ? 'var(--green)' : 'var(--red)';
  const dec = unit==='MW' ? 2 : 0;
  return '<tr>'+
    '<td>'+label+'</td>'+
    '<td class="num">'+le5.toLocaleString('id-ID',{maximumFractionDigits:dec})+' '+unit+'</td>'+
    '<td class="num">'+total.toLocaleString('id-ID',{maximumFractionDigits:dec})+' '+unit+'</td>'+
    '<td class="num" style="color:'+color+';font-weight:600;">'+pct.toFixed(1)+'%</td>'+
    '<td class="num" style="color:var(--text-muted);">'+slaTarget.toFixed(0)+'%</td>'+
  '</tr>';
}

function renderComponentDetail(idx){
  const gi = DATA.recap.scada.gi[idx];
  const jtm = DATA.recap.scada.jtm[idx];
  const rc = DATA.recap.scada.rc[idx];
  const sla = DATA.recap.scada.target_sla || {gi:65, jtm:65, rc:100};
  const slaGi = (sla.gi||0.65)*100, slaJtm = (sla.jtm||0.65)*100, slaRc = (sla.rc||1)*100;

  const giRows = componentDetailRow('Kali Event/Gangguan', gi.event_le5, gi.total_event, 'Kali', slaGi)

  const jtmRows = componentDetailRow('Kali Event/Gangguan', jtm.event_le5, jtm.total_event, 'Kali', slaJtm)
    + componentDetailRow('Trafo Distribusi', jtm.gardu_le5, jtm.total_gardu, 'Kali', slaJtm)

  const rcRows = componentDetailRow('Remote Kontrol', rc.rc_gagal, rc.aset_rc, 'Kali', slaRc, rc.pct_bulanan*100);

  document.getElementById('component-detail-scada').innerHTML =
    groupTable('Gardu Induk', giRows) + groupTable('JTM All Zona', jtmRows) + groupTable('Kesiapan RC', rcRows, 'RC Gagal');
}

function renderGIBreakdown(container, m, bulanNum){

      '<tr><td>'+r.gi+'</td><td>'+r.trafo+'</td><td class="num">'+(r.ftr_jam*60).toLocaleString('id-ID',{maximumFractionDigits:1})+'</td></tr>'
    ).join('');
  } else {
    head = '<tr><th>Gardu Induk</th><th>Trafo</th><th class="num">MW &le;5 Menit</th><th class="num">MW Total</th><th class="num">Trafo Distribusi &le;5 Menit</th><th class="num">Trafo Distribusi Total</th></tr>';
    body = sorted.map(r=>
      '<tr><td>'+r.gi+'</td><td>'+r.trafo+'</td>'+
      '<td class="num">'+r.mw_le5.toLocaleString('id-ID',{maximumFractionDigits:2})+'</td>'+
      '<td class="num">'+r.mw_tot.toLocaleString('id-ID',{maximumFractionDigits:2})+'</td>'+
      '<td class="num">'+r.gtt_le5.toLocaleString('id-ID',{maximumFractionDigits:2})+'</td>'+
      '<td class="num">'+r.gtt_tot.toLocaleString('id-ID',{maximumFractionDigits:2})+'</td></tr>'
    ).join('');
  }
  container.innerHTML = '<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
}

function renderJTMBreakdown(container, m, s, bulanNum){
  if(!JTM_DETAIL){
    container.innerHTML = '<div class="jtm-locked">Detail insiden JTM ('+ (JTM_DETAIL===null && DATA_SOURCE_URL ? 'sedang dimuat dari spreadsheet...' : 'perlu tersambung ke Apps Script untuk melihat detail ini') +')</div>';
    return;
  }
  const gk = groupBy[s.key] || 'z';
  const detailId = 'jtm-detail-'+m.key+'-'+s.key;
  container.innerHTML =
    '<div class="group-select" style="margin-bottom:16px;">'+JTM_GROUP_FIELDS.map(f=>
      '<button class="group-btn'+(f.key===gk?' active':'')+'" data-field="'+f.key+'">'+f.label+'</button>'
    ).join('')+'</div>'+
    '<div id="jtm-barlist-'+m.key+'-'+s.key+'"></div>'+
    '<details style="margin-top:18px;">'+
      '<summary style="cursor:pointer;font-family:\'IBM Plex Mono\',monospace;font-size:12px;color:var(--purple);">Detail Laporan Gangguan SE004</summary>'+
      '<div id="'+detailId+'" style="margin-top:14px;"></div>'+
    '</details>';

  function matchesSub(r){
    if(m.key==='scada'){
      return r.ah===1 && r.ak===0 && (r.zn==='zona 1' || r.zn==='zona 2');
    }
    if(s.key==='jtm_gt15') return r.ah===1 && r.ak===0 && r.aj==='lebih';
    if(s.key==='jtm_lt15') return r.ah===1 && r.ak===0 && r.aj==='kurang';
    return false;
  }
  const matchedRows = JTM_DETAIL.filter(r=> r.b===bulanNum && matchesSub(r));

  function draw(field){
    const map = {};
    matchedRows.forEach(r=>{
      const k = r[field] || '(tidak diketahui)';
      if(!map[k]) map[k] = {t:0, kali:0, mw:0};
      map[k].t += r.t*60; // jam -> menit
      map[k].kali += 1;
      map[k].mw += (r.ay + r.ba); // total mw kolom
    });
    const metricField = m.key==='ftr' ? 't' : 'mw';
    const entries = Object.entries(map).sort((a,b)=>b[1][metricField]-a[1][metricField]).slice(0,15);
    const maxVal = Math.max(...entries.map(e=>e[1][metricField]), 0.0001);
    const listId = 'jtm-barlist-'+m.key+'-'+s.key;
    document.getElementById(listId).innerHTML = entries.length ? entries.map(([k,v])=>{
      const pct = (v[metricField]/maxVal*100).toFixed(1);
      const displayVal = m.key==='ftr' ? v.t.toLocaleString('id-ID',{maximumFractionDigits:1})+' menit ('+v.kali+'x)' : v.kali+'x';
      return '<div class="bar-row"><span class="bar-label">'+k+'</span>'+
        '<span class="bar-track"><span class="bar-fill" style="width:'+pct+'%;background:'+m.color+'"></span></span>'+
        '<span class="bar-val">'+displayVal+'</span></div>';
    }).join('') : '<p class="hint">Tidak ada insiden pada bulan ini untuk kategori ini.</p>';
  }
  draw(gk);
  container.querySelectorAll('.group-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      groupBy[s.key] = btn.dataset.field;
      container.querySelectorAll('.group-btn').forEach(b=>b.classList.toggle('active', b===btn));
      draw(btn.dataset.field);
    });
  });

  const DETAIL_COLS = [
    { key:'no',  label:'No', type:'index' },
    { key:'nl',  label:'No Laporan', type:'text' },
    { key:'u',   label:'UP3', type:'text' },
    { key:'p',   label:'Penyulang', type:'text' },
    { key:'tp',  label:'Tanggal Padam', type:'date' },
    { key:'wp',  label:'Waktu Padam', type:'text' },
    { key:'tn',  label:'Tanggal Nyala', type:'date' },
    { key:'jp',  label:'Jumlah Pelanggan Padam', type:'num', get:r=>r.jp||0 },
    { key:'lama',label:'Lama Padam (menit)', type:'num', get:r=>r.t*60 },
    { key:'jxp', label:'Jam x Pelanggan Padam', type:'num', get:r=>r.jxp||0 },
    { key:'ens', label:'ENS', type:'num', get:r=>r.ens||0 },
  ];

  function parseDMY(str){
    if(!str) return 0;
    const parts = str.split('/');
    if(parts.length!==3) return 0;
    return new Date(+parts[2], +parts[1]-1, +parts[0]).getTime();
  }

  let sortState = { field:'lama', dir:'desc' };

  function sortedRows(){
    const col = DETAIL_COLS.find(c=>c.key===sortState.field);
    const arr = [...matchedRows];
    if(!col || col.type==='index') return arr;
    arr.sort((a,b)=>{
      let va, vb;
      if(col.type==='num'){ va = col.get(a); vb = col.get(b); }
      else if(col.type==='date'){ va = parseDMY(a[col.key]); vb = parseDMY(b[col.key]); }
      else { va = (a[col.key]||''); vb = (b[col.key]||''); }
      if(va < vb) return sortState.dir==='asc' ? -1 : 1;
      if(va > vb) return sortState.dir==='asc' ? 1 : -1;
      return 0;
    });
    return arr;
  }

  function currentTableRows(){
    return sortedRows();
  }

  function renderTable(){
    const rows = currentTableRows();
    const headHtml = DETAIL_COLS.map(c=>{
      const arrow = sortState.field===c.key ? (sortState.dir==='asc'?'&#9650;':'&#9660;') : '';
      const numCls = c.type==='num' ? ' class="num"' : '';
      return '<th'+numCls+' data-field="'+c.key+'">'+c.label+(arrow?' <span class="sort-arrow">'+arrow+'</span>':'')+'</th>';
    }).join('');
    const bodyHtml = rows.map((r,idx)=>
      '<tr>'+
      '<td>'+(idx+1)+'</td>'+
      '<td>'+(r.nl||'-')+'</td><td>'+(r.u||'-')+'</td><td>'+(r.p||'-')+'</td>'+
      '<td>'+(r.tp||'-')+'</td><td>'+(r.wp||'-')+'</td><td>'+(r.tn||'-')+'</td>'+
      '<td class="num">'+(r.jp||0).toLocaleString('id-ID')+'</td>'+
      '<td class="num">'+(r.t*60).toLocaleString('id-ID',{maximumFractionDigits:1})+'</td>'+
      '<td class="num">'+(r.jxp||0).toLocaleString('id-ID',{maximumFractionDigits:2})+'</td>'+
      '<td class="num">'+(r.ens||0).toLocaleString('id-ID',{maximumFractionDigits:2})+'</td>'+
      '</tr>'
    ).join('');
    document.getElementById(detailId).innerHTML =
      '<p class="hint" style="margin-bottom:10px;">Menampilkan seluruh insiden yang cocok pada bulan &amp; kategori ini. Klik judul kolom untuk mengurutkan.</p>'+
      '<div class="export-row">'+
        '<button class="export-btn" id="export-xlsx-'+m.key+'-'+s.key+'">&#11015; Export Excel</button>'+
        '<button class="export-btn" id="export-pdf-'+m.key+'-'+s.key+'">&#11015; Export PDF</button>'+
      '</div>'+
      '<div class="sticky-table-wrap"><table><thead><tr>'+headHtml+'</tr></thead>'+
      '<tbody>'+(bodyHtml || '<tr><td colspan="11" class="hint">Tidak ada data.</td></tr>')+'</tbody></table></div>';

    document.querySelectorAll('#'+detailId+' thead th').forEach(th=>{
      th.addEventListener('click', ()=>{
        const field = th.dataset.field;
        if(field==='no') return;
        if(sortState.field===field){ sortState.dir = sortState.dir==='asc'?'desc':'asc'; }
        else { sortState = { field:field, dir: field==='lama' ? 'desc' : 'asc' }; }
        renderTable();
      });
    });

    const exportRows = currentTableRows();
    const exportData = exportRows.map((r,idx)=>({
      'No': idx+1,
      'No Laporan': r.nl||'-',
      'UP3': r.u||'-',
      'Penyulang': r.p||'-',
      'Tanggal Padam': r.tp||'-',
      'Waktu Padam': r.wp||'-',
      'Tanggal Nyala': r.tn||'-',
      'Jumlah Pelanggan Padam': r.jp||0,
      'Lama Padam (menit)': +(r.t*60).toFixed(1),
      'Jam x Pelanggan Padam': +((r.jxp||0).toFixed(2)),
      'ENS': +((r.ens||0).toFixed(2)),
    }));
    const fileBase = 'Detail_Laporan_Gangguan_SE004_'+MONTHS[bulanNum-1]+'_'+m.key+'_'+s.key;

    const xlsxBtn = document.getElementById('export-xlsx-'+m.key+'-'+s.key);
    if(xlsxBtn) xlsxBtn.addEventListener('click', ()=>{
      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Detail Gangguan');
      XLSX.writeFile(wb, fileBase+'.xlsx');
    });

    const pdfBtn = document.getElementById('export-pdf-'+m.key+'-'+s.key);
    if(pdfBtn) pdfBtn.addEventListener('click', ()=>{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation:'landscape' });
      doc.setFontSize(12);
      doc.text('Detail Laporan Gangguan SE004', 14, 12);
      doc.autoTable({
        startY: 18,
        head: [Object.keys(exportData[0]||{'No':''})],
        body: exportData.map(row=>Object.values(row)),
        styles:{ fontSize:7 },
        headStyles:{ fillColor:[240,169,59] },
      });
      doc.save(fileBase+'.pdf');
    });
  }

  const detailsEl = container.querySelector('details');
  detailsEl.addEventListener('toggle', function(){
    if(!detailsEl.open) return;
    renderTable();
  });
}

  });

function detectAnomalies(){
  const found = [];
  // contoh: anomali GTT Agustus SCADA JTM (diketahui dari validasi)
  const scadaJtm = DATA.recap.scada.jtm;
  if(scadaJtm && scadaJtm[7]){
    const augGtt = scadaJtm[7];
    if(augGtt.total_gardu > 0 && augGtt.gardu_le5 / augGtt.total_gardu > 0.9){
      found.push({month:'Agustus', message:'Rasio "gardu \u2264 5 menit" terhadap total gardu pada bulan Agustus (Efektivitas SCADA - JTM) tampak tidak wajar dibanding bulan lain, kemungkinan ada input data yang belum lengkap di sumbernya.'});
    }
  }
  return found;
}
function updateNotifications(){
  const notifications = detectAnomalies();
  const badge = document.getElementById('notifBadge');
  const list = document.getElementById('notifList');
  if(notifications.length){
    badge.style.display = 'flex'; badge.textContent = notifications.length;
    list.innerHTML = notifications.map(n=>'<div class="notif-item"><strong>'+n.month+'</strong>'+n.message+'</div>').join('');
  } else {
    badge.style.display = 'none';
    list.innerHTML = '<div class="notif-empty">Tidak ada notifikasi saat ini.</div>';
  }
}
function setupNotificationToggle(){
  const btn = document.getElementById('notifBtn');
  const panel = document.getElementById('notifPanel');
  const badge = document.getElementById('notifBadge');
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    panel.classList.toggle('open');
    if(panel.classList.contains('open')) badge.style.display='none';
  });
  document.addEventListener('click', (e)=>{
    if(!panel.contains(e.target) && e.target!==btn) panel.classList.remove('open');
  });
}
setupNotificationToggle();

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function fetchWithRetry(url, maxAttempts){
  let lastErr;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    try{
      const res = await fetch(url, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    } catch(err){
      lastErr = err;
      if(attempt < maxAttempts){
        liveStatusEl.textContent = 'Menarik data terbaru dari spreadsheet... (percobaan '+attempt+' gagal, mencoba lagi)';
        await sleep(attempt * 1500);
      }
    }
  }
  throw lastErr;
}

async function loadLiveData(){
  if(!DATA_SOURCE_URL){ return; }
  liveStatusEl.style.display='flex'; liveStatusEl.className='live-status loading';
  liveStatusEl.textContent = 'Menarik data terbaru dari spreadsheet (bisa beberapa detik, data JTM besar)...';
  try{
    const fresh = await fetchWithRetry(DATA_SOURCE_URL + (DATA_SOURCE_URL.indexOf('?')===-1?'?':'&') + 'key=' + encodeURIComponent(DASHBOARD_API_KEY), 3);
    if(!fresh || !fresh.months || !fresh.recap) throw new Error('Format data tidak sesuai');
    DATA = { months: fresh.months, months_label: MONTHS_LABEL, recap: fresh.recap, breakdown_gi: fresh.breakdown_gi };
    JTM_DETAIL = fresh.breakdown_jtm || [];
    initDashboard();
    liveStatusEl.className='live-status ok';
    liveStatusEl.textContent = 'Data terbaru berhasil dimuat dari spreadsheet \u00b7 '+new Date().toLocaleString('id-ID');
    setTimeout(()=>{liveStatusEl.style.display='none';}, 5000);
  } catch(err){
    liveStatusEl.className='live-status error';
    liveStatusEl.textContent = 'Gagal menarik data terbaru setelah beberapa percobaan, menampilkan data tersimpan terakhir ('+err.message+')';
  }
}
loadLiveData();

<script>
(function(){
  var AUTH_STORAGE_KEY = 'pln_dash_auth_v1';
  var SESSION_HOURS = 24;
  var VALID_USER = 'admin';
  var VALID_PASS = 'admin';

  function isLoggedIn(){
    try{
      var raw = localStorage.getItem(AUTH_STORAGE_KEY);
      if(!raw) return false;
      var data = JSON.parse(raw);
      return data && data.exp > Date.now();
    }catch(e){ return false; }
  }
  function doLogin(){
    var u = document.getElementById('authUser').value.trim();
    var p = document.getElementById('authPass').value;
    if(u===VALID_USER && p===VALID_PASS){
      localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({exp: Date.now() + SESSION_HOURS*3600*1000}));
      document.getElementById('authOverlay').style.display = 'none';
    } else {
      document.getElementById('authError').style.display = 'block';
    }
  }
  function doLogout(){
    localStorage.removeItem(AUTH_STORAGE_KEY);
    location.reload();
  }
  if(isLoggedIn()){
    document.getElementById('authOverlay').style.display = 'none';
  }
  document.getElementById('authSubmit').addEventListener('click', doLogin);
  document.getElementById('authPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  document.getElementById('authUser').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  var logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', doLogout);
})();
</script>
