<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Keandalan Sistem 2026 — PT PLN Distribusi Jawa Timur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#0E1420; --surface:#161D2C; --surface-2:#1D2537; --border:#2A3448;
    --text-primary:#EAF0FA; --text-secondary:#8D9AB5; --text-muted:#5C6A87;
    --amber:#F0A93B; --amber-dim:#4A3A1C;
    --teal:#35C4B8; --teal-dim:#173A38;
    --red:#E5564F; --red-dim:#3A1F1E;
    --green:#3DCB6C; --green-dim:#173A24;
  }
  html[data-theme="light"]{
    --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#F0F2F8; --border:#DCE1EC;
    --text-primary:#1B2333; --text-secondary:#5B6B85; --text-muted:#8B96A8;
    --amber:#B9720A; --amber-dim:#FBEBD3;
    --teal:#0E8F82; --teal-dim:#DCF3F0;
    --red:#C23B34; --red-dim:#FBE1DF;
    --green:#1E9A50; --green-dim:#DFF5E7;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text-primary);font-family:'Inter',sans-serif;padding:28px 24px 64px;transition:background .2s,color .2s;}
  .wrap{max-width:1100px;margin:0 auto;}
  .top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:20px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--teal);text-transform:uppercase;margin:0 0 6px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em;}
  .meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-secondary);text-align:right;line-height:1.6;}

  .metric-tabs{display:flex;gap:8px;margin-bottom:22px;border-bottom:1px solid var(--border);}
  .metric-tab{
    font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;
    background:transparent;border:none;color:var(--text-secondary);
    padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .metric-tab.active{color:var(--amber);border-bottom-color:var(--amber);}

  .theme-toggle{
    display:inline-flex;align-items:center;gap:7px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary);
    padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;
  }
  .theme-toggle:hover{color:var(--text-primary);border-color:var(--text-muted);}

  .notif-wrap{position:relative;}
  .notif-btn{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    font-size:15px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary);
    width:36px;height:36px;border-radius:8px;cursor:pointer;
  }
  .notif-btn:hover{color:var(--text-primary);border-color:var(--text-muted);}
  .notif-badge{
    position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;
    background:var(--red);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    border-radius:999px;display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .notif-panel{
    display:none;position:absolute;top:calc(100% + 10px);right:0;width:320px;max-width:80vw;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;
    box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:60;
  }
  .notif-panel.open{display:block;}
  .notif-panel-head{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;margin-bottom:10px;color:var(--text-primary);}
  .notif-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.6;color:var(--text-secondary);}
  .notif-item:last-child{border-bottom:none;}
  .notif-item strong{color:var(--amber);display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .notif-empty{font-size:12px;color:var(--text-muted);padding:6px 0;}

  .live-status{
    display:flex;align-items:center;gap:8px;
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    padding:8px 14px;border-radius:8px;margin:-10px 0 20px;
  }
  .live-status.loading{background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border);}
  .live-status.ok{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal-dim);}
  .live-status.error{background:var(--red-dim);color:var(--red);border:1px solid var(--red-dim);}

  .metric-page{display:none;}
  .metric-page.active{display:block;}

  section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin-bottom:20px;}
  .section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  h2{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin:0;}
  .glow-heading{
    text-shadow: 0 0 14px var(--glow-color, var(--amber)), 0 0 28px var(--glow-color, var(--amber)), 0 0 3px rgba(255,255,255,.6);
  }
  html[data-theme="light"] .glow-heading{ text-shadow:none; }
  .subnote{font-size:12px;color:var(--text-muted);margin:-8px 0 16px;line-height:1.6;}

  .slicer{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:4px;}
  .slicer-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:transparent;border:none;
    color:var(--text-secondary);padding:7px 12px;border-radius:6px;cursor:pointer;
  }
  .slicer-btn.active{background:var(--amber-dim);color:var(--amber);}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden;}
  .kpi::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--kpi-accent,var(--teal));}
  .kpi-label{font-size:11.5px;color:var(--text-secondary);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  .kpi-value{font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:600;margin:0;font-variant-numeric:tabular-nums;}
  .kpi-unit{font-size:12px;color:var(--text-muted);font-weight:400;margin-left:4px;}

  .chart-wrap{position:relative;height:260px;}

  .achieve-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:18px 20px;}
  .achieve-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .achieve-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:var(--text-secondary);}
  .achieve-pct{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;}
  .achieve-bar-track{background:var(--bg);border-radius:6px;height:14px;overflow:hidden;margin-bottom:12px;border:1px solid var(--border);}
  .achieve-bar-fill{height:100%;border-radius:6px;transition:width .5s,background-color .3s;}
  .achieve-detail{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-secondary);}
  .achieve-detail strong{color:var(--text-primary);font-weight:600;}
  .achieve-status{display:inline-block;margin-top:12px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;}

  .breadcrumb{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .crumb{cursor:pointer;color:var(--teal);padding:3px 8px;border:1px solid var(--teal-dim);border-radius:5px;background:var(--teal-dim);}
  .crumb:hover{opacity:.75;}
  .crumb.current{color:var(--text-primary);background:var(--surface-2);border-color:var(--border);cursor:default;}
  .sep{color:var(--text-muted);}

  .bar-row{display:grid;grid-template-columns:200px 1fr 100px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .bar-row:last-child{border-bottom:none;}
  .bar-row:hover .bar-label{color:var(--amber);}
  .bar-row.leaf{cursor:default;}
  .bar-row.leaf:hover .bar-label{color:var(--text-primary);}
  .bar-label{font-size:13px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{background:var(--surface-2);border-radius:4px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--teal);border-radius:4px;transition:width .3s;}
  .bar-val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-secondary);text-align:right;font-variant-numeric:tabular-nums;}
  .hint{font-size:12px;color:var(--text-muted);margin-top:12px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:500;padding:0 10px 10px;border-bottom:1px solid var(--border);}
  th.num,td.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  td{padding:10px;border-bottom:1px solid var(--border);color:var(--text-primary);}
  tr:last-child td{border-bottom:none;}
  .rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:5px;background:var(--amber-dim);color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:11px;margin-right:8px;}

  .footnote{font-size:12px;color:var(--text-muted);line-height:1.7;border-top:1px solid var(--border);padding-top:16px;margin-top:8px;}
  .footnote strong{color:var(--text-secondary);font-weight:500;}
  .anomaly{font-size:12px;color:var(--amber);background:var(--amber-dim);border-radius:8px;padding:10px 14px;margin-bottom:16px;line-height:1.6;}

  @media (max-width:640px){
    .bar-row{grid-template-columns:120px 1fr 80px;}
  }
</style>
</head>

let DATA = EMBEDDED_DATA;
let MONTHS, MONTHS_LABEL;

// ---- Theme ----
let currentTheme = 'dark';
const THEME_COLORS = {
  dark:  { grid:'#2A3448', tick:'#8D9AB5' },
  light: { grid:'#DCE1EC', tick:'#5B6B85' },
};
const themeToggleBtn = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const themeLabel = document.getElementById('themeLabel');
function applyTheme(theme){
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  themeIcon.innerHTML = theme === 'dark' ? '&#9789;' : '&#9728;';
  themeLabel.textContent = theme === 'dark' ? 'Dark' : 'Light';
  const c = THEME_COLORS[theme];
  Object.values(chartInstances).forEach(chart=>{
    chart.options.scales.x.ticks.color = c.tick;
    chart.options.scales.x.grid.color = c.grid;
    chart.options.scales.y.ticks.color = c.tick;
    chart.options.scales.y.grid.color = c.grid;
    chart.options.plugins.legend.labels.color = c.tick;
    chart.update();
  });
}
themeToggleBtn.addEventListener('click', ()=>{
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
});

let activeMetric = 'saidi';
let selectedMonthIdx = {}; // per metric
let drillPath = {}; // per metric
let chartInstances = {};

const tabsEl = document.getElementById('metricTabs');
const pagesEl = document.getElementById('pages');
const liveStatusEl = document.getElementById('liveStatus');

// ---- Tabs (event delegation - dipasang sekali saja) ----
tabsEl.addEventListener('click', e=>{
  const btn = e.target.closest('.metric-tab');
  if(!btn) return;
  activeMetric = btn.dataset.metric;
  document.querySelectorAll('.metric-tab').forEach(b=>b.classList.toggle('active', b.dataset.metric===activeMetric));
  document.querySelectorAll('.metric-page').forEach(p=>p.classList.toggle('active', p.id==='page-'+activeMetric));
  ensureChart(activeMetric);
});

// ---- Render / build ulang seluruh dashboard dari DATA saat ini ----
function initDashboard(){
  MONTHS = DATA.months;
  MONTHS_LABEL = DATA.months_label;

  METRICS.forEach(m => { if(!(m.key in selectedMonthIdx)) selectedMonthIdx[m.key] = MONTHS.length - 1; });
  METRICS.forEach(m => { if(!(m.key in drillPath)) drillPath[m.key] = []; });

  Object.values(chartInstances).forEach(c => { try{ c.destroy(); }catch(e){} });
  chartInstances = {};

  tabsEl.innerHTML = METRICS.map(m =>
    '<button class="metric-tab'+(m.key===activeMetric?' active':'')+'" data-metric="'+m.key+'">'+m.label+'</button>'
  ).join('');

  pagesEl.innerHTML = METRICS.map(m => buildPageSkeleton(m)).join('');

  METRICS.forEach(m=>{
    renderSlicer(m);
    renderKpi(m);
    achieveCard(m);
    renderBreakdown(m);
    renderTopTable(m);
  });
  updateNotifications();
  ensureChart(activeMetric);
}

function buildPageSkeleton(m){
  return '<div class="metric-page'+(m.key===activeMetric?' active':'')+'" id="page-'+m.key+'">'+

    '<section>'+
      '<div class="section-head"><h2>Pilih bulan</h2><div class="slicer" id="slicer-'+m.key+'"></div></div>'+
      '<div class="kpi-row" id="kpi-'+m.key+'"></div>'+
    '</section>'+

    '<section>'+
      '<div class="section-head"><h2 class="glow-heading" style="--glow-color:'+m.color+'">Tren bulanan '+m.label+' &mdash; realisasi vs target</h2></div>'+
      '<div class="chart-wrap"><canvas id="chart-'+m.key+'"></canvas></div>'+
    '</section>'+

    '<section>'+
      '<div class="section-head"><h2>Pencapaian kumulatif vs target</h2></div>'+
      '<p class="subnote">Realisasi kumulatif Januari s/d bulan terpilih, dibandingkan target kumulatif tahun berjalan. Cakupan: Gardu Induk, Penyulang, Gardu Distribusi (tidak termasuk JTR dan Sambungan Tenaga Listrik dan APP).</p>'+
      '<div class="achieve-card" id="achieve-'+m.key+'"></div>'+
    '</section>'+

    '<section>'+
      '<div class="section-head"><h2>Breakdown penyebab gangguan &mdash; bulan terpilih</h2></div>'+
      '<div class="breadcrumb" id="breadcrumb-'+m.key+'"></div>'+
      '<div id="barlist-'+m.key+'"></div>'+
      '<p class="hint" id="hint-'+m.key+'">Klik salah satu baris untuk melihat detail satu level lebih dalam.</p>'+
    '</section>'+

    '<section>'+
      '<div class="section-head"><h2>10 penyebab gangguan dengan kontribusi terbesar (Tidak Terencana) &mdash; bulan terpilih</h2></div>'+
      '<table><thead><tr><th>Penyebab</th><th>Sub Fasilitas</th><th class="num">Nilai</th><th class="num">Kontribusi</th><th class="num">Jml gangguan</th></tr></thead><tbody id="toptable-'+m.key+'"></tbody></table>'+
    '</section>'+

  '</div>';
}

function metricByKey(key){ return METRICS.find(m=>m.key===key); }

function renderSlicer(m){
  const el = document.getElementById('slicer-'+m.key);
  el.innerHTML = MONTHS.map((mo,i) =>
    '<button class="slicer-btn'+(i===selectedMonthIdx[m.key]?' active':'')+'" data-idx="'+i+'">'+MONTHS_LABEL[i].slice(0,3)+'</button>'
  ).join('');
  el.querySelectorAll('.slicer-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedMonthIdx[m.key] = parseInt(btn.dataset.idx);
      drillPath[m.key] = [];
      renderAll(m.key);
    });
  });
}

function renderKpi(m){
  const idx = selectedMonthIdx[m.key];
  const recap = DATA.recap[m.key];
  const realB = recap.realisasi_bulanan[idx];
  const targB = recap.target_bulanan[idx];
  const pctB = recap.pencapaian_bulanan[idx]*100;
  const realK = recap.realisasi_kumulatif[idx];
  const targK = recap.target_kumulatif[idx];

  const kpis = [
    {label:'Realisasi bulan ini', value:realB.toLocaleString('id-ID',{minimumFractionDigits:m.decimals,maximumFractionDigits:m.decimals}), unit:m.unit, accent:m.color},
    {label:'Target bulan ini', value:targB.toLocaleString('id-ID',{minimumFractionDigits:m.decimals,maximumFractionDigits:m.decimals}), unit:m.unit, accent:'var(--text-secondary)'},
    {label:'Pencapaian bulanan', value:pctB.toFixed(1), unit:'%', accent: pctB<=100?'var(--teal)':'var(--red)'},
    {label:'Realisasi kumulatif', value:realK.toLocaleString('id-ID',{minimumFractionDigits:m.decimals,maximumFractionDigits:m.decimals}), unit:m.unit, accent:'var(--text-secondary)'},
  ];
  document.getElementById('kpi-'+m.key).innerHTML = kpis.map(k=>
    '<div class="kpi" style="--kpi-accent:'+k.accent+'"><p class="kpi-label">'+k.label+'</p><p class="kpi-value">'+k.value+'<span class="kpi-unit">'+k.unit+'</span></p></div>'
  ).join('');
}

function baseBarColors(key){
  const m = metricByKey(key);
  const recap = DATA.recap[key];
  return recap.realisasi_bulanan.map((v,i)=> i===selectedMonthIdx[key] ? m.color : m.color+'55');
}

function ensureChart(key){
  if(chartInstances[key]) { chartInstances[key].resize(); return; }
  const m = metricByKey(key);
  const recap = DATA.recap[key];
  const ctx = document.getElementById('chart-'+key).getContext('2d');
  chartInstances[key] = new Chart(ctx, {
    data: {
      labels: MONTHS_LABEL.map(l=>l.slice(0,3)),
      datasets: [
        {
          type:'bar',
          label:'Realisasi bulanan',
          data: recap.realisasi_bulanan,
          backgroundColor: baseBarColors(key),
          borderRadius:4,
          order:2,
        },
        {
          type:'line',
          label:'Target bulanan',
          data: recap.target_bulanan,
          borderColor:'#E5564F',
          borderDash:[5,4],
          pointRadius:0,
          borderWidth:2,
          tension:0,
          order:1,
        }
      ]
    },
    options: {
      responsive:true,
      maintainAspectRatio:false,
      onClick: (evt, elements) => {
        if(elements.length){
          selectedMonthIdx[key] = elements[0].index;
          drillPath[key] = [];
          renderAll(key);
        }
      },
      onHover: (evt, elements, chartRef) => {
        const barEl = elements.find(el => el.datasetIndex === 0);
        const hoverIdx = barEl ? barEl.index : null;
        const base = baseBarColors(key);
        chartRef.data.datasets[0].backgroundColor = base.map((c,i)=>{
          if(hoverIdx === null) return c;
          return i === hoverIdx ? m.color : m.color+'1a';
        });
        chartRef.update('none');
      },
      plugins:{
        legend:{ labels:{ color:'#8D9AB5', font:{family:'Inter', size:11} } },
        tooltip:{ mode:'index', intersect:false }
      },
      scales:{
        x:{ ticks:{ color:THEME_COLORS[currentTheme].tick, font:{family:'IBM Plex Mono', size:10} }, grid:{ color:THEME_COLORS[currentTheme].grid } },
        y:{ ticks:{ color:THEME_COLORS[currentTheme].tick, font:{family:'IBM Plex Mono', size:10} }, grid:{ color:THEME_COLORS[currentTheme].grid } }
      }
    }
  });
}

function updateChartHighlight(key){
  const chart = chartInstances[key];
  if(!chart) return;
  chart.data.datasets[0].backgroundColor = baseBarColors(key);
  chart.update();
}

function valueGradientRGB(pct){
  const stops = [
    {p:0,   c:[53,196,184]},  // teal - nilai rendah
    {p:40,  c:[240,169,59]},  // amber - menengah
    {p:100, c:[229,86,79]},   // merah - nilai tinggi (relatif terhadap maksimum grup)
  ];
  const clamped = Math.max(0, Math.min(pct, 100));
  let lo = stops[0], hi = stops[stops.length-1];
  for(let i=0;i<stops.length-1;i++){
    if(clamped >= stops[i].p && clamped <= stops[i+1].p){ lo=stops[i]; hi=stops[i+1]; break; }
  }
  const range = (hi.p - lo.p) || 1;
  const t = (clamped - lo.p)/range;
  return [
    Math.round(lo.c[0] + (hi.c[0]-lo.c[0])*t),
    Math.round(lo.c[1] + (hi.c[1]-lo.c[1])*t),
    Math.round(lo.c[2] + (hi.c[2]-lo.c[2])*t),
  ];
}

function achieveCard(m){
  const idx = selectedMonthIdx[m.key];
  const recap = DATA.recap[m.key];
  const real = recap.realisasi_kumulatif[idx];
  const target = recap.target_kumulatif[idx];
  const pct = recap.pencapaian_kumulatif[idx]*100;
  let color, statusText, statusBg;
  if(pct>=100){ color='var(--green)'; statusText='Tercapai'; statusBg='var(--green-dim)'; }
  else if(pct>=90){ color='var(--amber)'; statusText='Perlu Perhatian'; statusBg='var(--amber-dim)'; }
  else { color='var(--red)'; statusText='Tidak Tercapai'; statusBg='var(--red-dim)'; }
  const barWidth = Math.min(pct,100).toFixed(1);
  document.getElementById('achieve-'+m.key).innerHTML =
    '<div class="achieve-head"><span class="achieve-title">'+m.label+' kumulatif s/d '+MONTHS_LABEL[idx]+'</span><span class="achieve-pct" style="color:'+color+'">'+pct.toFixed(1)+'%</span></div>'+
    '<div class="achieve-bar-track"><div class="achieve-bar-fill" style="width:'+barWidth+'%;background:'+color+'"></div></div>'+
    '<div class="achieve-detail"><span>Realisasi: <strong>'+real.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+m.unit+'</strong></span><span>Target: <strong>'+target.toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+m.unit+'</strong></span></div>'+
    '<span class="achieve-status" style="color:'+color+';background:'+statusBg+'">'+statusText+'</span>';
}

const LEVELS = ['kelompok','sub_kelompok','fasilitas','sub_fasilitas','item'];

// ---- Notifications (anomali data) ----
function detectAnomalies(){
  const found = [];
  MONTHS.forEach((mk, i) => {
    const bd = DATA.breakdown[mk];
    if(!bd) return;
    const sumSaidi = bd.data.reduce((a,r)=>a+r.saidi, 0);
    const headerSaidi = bd.header.saidi_jam;
    if(headerSaidi > 0){
      const diff = Math.abs(sumSaidi - headerSaidi) / headerSaidi;
      if(diff > 0.15){
        found.push({
          month: MONTHS_LABEL[i],
          message: 'Total SAIDI/SAIFI pada header laporan asli bulan '+MONTHS_LABEL[i]+' tidak konsisten dengan rincian breakdown-nya (kemungkinan salah input di sumber data). Breakdown di dashboard memakai hasil penjumlahan rincian per item, yang tervalidasi konsisten dengan bulan-bulan lain.'
        });
      }
    }
  });
  return found;
}

function updateNotifications(){
  const notifications = detectAnomalies();
  const badge = document.getElementById('notifBadge');
  const list = document.getElementById('notifList');
  if(notifications.length){
    badge.style.display = 'flex';
    badge.textContent = notifications.length;
    list.innerHTML = notifications.map(n =>
      '<div class="notif-item"><strong>'+n.month+'</strong>'+n.message+'</div>'
    ).join('');
  } else {
    badge.style.display = 'none';
    list.innerHTML = '<div class="notif-empty">Tidak ada notifikasi saat ini.</div>';
  }
}

function setupNotificationToggle(){
  const btn = document.getElementById('notifBtn');
  const panel = document.getElementById('notifPanel');
  const badge = document.getElementById('notifBadge');
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    panel.classList.toggle('open');
    if(panel.classList.contains('open')){
      badge.style.display = 'none';
    }
  });
  document.addEventListener('click', (e)=>{
    if(!panel.contains(e.target) && e.target !== btn){
      panel.classList.remove('open');
    }
  });
}
setupNotificationToggle();

function renderBreakdown(m){
  const idx = selectedMonthIdx[m.key];
  const monthKey = MONTHS[idx];
  const monthData = DATA.breakdown[monthKey].data;
  const path = drillPath[m.key];

  const crumbEl = document.getElementById('breadcrumb-'+m.key);
  let crumbHtml = '<span class="crumb'+(path.length===0?' current':'')+'" data-idx="0">Semua kelompok</span>';
  path.forEach((p,i)=>{
    const isLast = i===path.length-1;
    crumbHtml += '<span class="sep">/</span><span class="crumb'+(isLast?' current':'')+'" data-idx="'+(i+1)+'">'+p.replace(/^(KELOMPOK|SUB KELOMPOK|FASILITAS|SUB FASILITAS)\s*/,'')+'</span>';
  });
  crumbEl.innerHTML = crumbHtml;
  crumbEl.querySelectorAll('.crumb').forEach(c=>{
    c.addEventListener('click', ()=>{
      drillPath[m.key] = path.slice(0, parseInt(c.dataset.idx));
      renderBreakdown(m);
    });
  });

  const currentLevel = path.length;
  const isLeafLevel = currentLevel >= LEVELS.length - 1;
  const rows = monthData.filter(row => path.every((p,i)=>row[LEVELS[i]]===p));
  const groupKey = LEVELS[currentLevel];

  let groups;
  if(isLeafLevel){
    groups = rows.map(r=>({name:r.item, value:r[m.breakdownField], row:r}));
  } else {
    const map = {};
    rows.forEach(r=>{
      const k = r[groupKey];
      if(!map[k]) map[k]=0;
      map[k]+=r[m.breakdownField];
    });
    groups = Object.keys(map).map(k=>({name:k, value:map[k]}));
  }
  groups.sort((a,b)=>b.value-a.value);
  const maxVal = Math.max(...groups.map(g=>g.value), 0.0000001);

  const listEl = document.getElementById('barlist-'+m.key);
  listEl.innerHTML = groups.map(g=>{
    const rawPct = g.value/maxVal*100;
    const pct = rawPct.toFixed(1);
    const isZero = g.value <= 0;
    const displayWidth = isZero ? 1.5 : Math.max(rawPct, 3);
    let barColor;
    if(isZero){
      barColor = 'rgba(140,150,170,0.35)';
    } else {
      const [r,gc,b] = valueGradientRGB(rawPct);
      barColor = 'rgb('+r+','+gc+','+b+')';
    }
    const label = g.name.replace(/^(KELOMPOK|SUB KELOMPOK|FASILITAS|SUB FASILITAS)\s*/,'');
    return '<div class="bar-row'+(isLeafLevel?' leaf':'')+'" data-name="'+encodeURIComponent(g.name)+'">'+
      '<span class="bar-label">'+label+'</span>'+
      '<span class="bar-track"><span class="bar-fill" style="width:'+displayWidth+'%;background:'+barColor+'" title="'+pct+'% dari nilai tertinggi"></span></span>'+
      '<span class="bar-val">'+m.toDisplay(g.value).toLocaleString('id-ID',{minimumFractionDigits:m.decimals,maximumFractionDigits:m.decimals})+'</span>'+
    '</div>';
  }).join('');

  if(!isLeafLevel){
    listEl.querySelectorAll('.bar-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        drillPath[m.key] = [...path, decodeURIComponent(row.dataset.name)];
        renderBreakdown(m);
      });
    });
  }
  document.getElementById('hint-'+m.key).style.display = isLeafLevel ? 'none' : 'block';
}

function renderTopTable(m){
  const idx = selectedMonthIdx[m.key];
  const monthKey = MONTHS[idx];
  const monthData = DATA.breakdown[monthKey].data.filter(r => r.sub_kelompok === 'SUB KELOMPOK Padam Tidak Terencana');
  const total = monthData.reduce((a,r)=>a+r[m.breakdownField],0);
  const top = [...monthData].sort((a,b)=>b[m.breakdownField]-a[m.breakdownField]).slice(0,10);
  document.getElementById('toptable-'+m.key).innerHTML = top.map((r,i)=>{
    const subFasilitas = r.sub_fasilitas.replace(/^(SUB FASILITAS)\s*/,'');
    const pct = total>0 ? (r[m.breakdownField]/total*100).toFixed(1) : '0.0';
    return '<tr>'+
      '<td><span class="rank">'+(i+1)+'</span>'+r.item+'</td>'+
      '<td style="color:var(--text-secondary);font-size:12px;">'+subFasilitas+'</td>'+
      '<td class="num">'+m.toDisplay(r[m.breakdownField]).toLocaleString('id-ID',{minimumFractionDigits:m.decimals,maximumFractionDigits:m.decimals})+'</td>'+
      '<td class="num">'+pct+'%</td>'+
      '<td class="num">'+Math.round(r.jml_gangguan).toLocaleString('id-ID')+'</td>'+
    '</tr>';
  }).join('');
}

function renderAll(key){
  const m = metricByKey(key);
  document.querySelectorAll('#slicer-'+key+' .slicer-btn').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.idx)===selectedMonthIdx[key]);
  });
  renderKpi(m);
  updateChartHighlight(key);
  achieveCard(m);
  renderBreakdown(m);
  renderTopTable(m);
}

// ---- Muat data ----
// 1) Render dulu pakai data tersimpan (EMBEDDED_DATA) supaya dashboard langsung
//    tampil tanpa jeda, baru coba tarik data terbaru dari spreadsheet (jika
//    DATA_SOURCE_URL sudah diisi).
initDashboard();

async function loadLiveData(){
  if(!DATA_SOURCE_URL){
    return; // belum disambungkan ke Apps Script, tetap pakai data tersimpan
  }
  liveStatusEl.style.display = 'flex';
  liveStatusEl.className = 'live-status loading';
  liveStatusEl.textContent = 'Menarik data terbaru dari spreadsheet...';
  try{
    const res = await fetch(DATA_SOURCE_URL, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const fresh = await res.json();
    if(!fresh || !fresh.months || !fresh.recap || !fresh.breakdown){
      throw new Error('Format data dari spreadsheet tidak sesuai');
    }
    DATA = fresh;
    initDashboard();
    liveStatusEl.className = 'live-status ok';
    liveStatusEl.textContent = 'Data terbaru berhasil dimuat dari spreadsheet \u00b7 ' + new Date().toLocaleString('id-ID');
    setTimeout(()=>{ liveStatusEl.style.display = 'none'; }, 5000);
  } catch(err){
    liveStatusEl.className = 'live-status error';
    liveStatusEl.textContent = 'Gagal menarik data terbaru, menampilkan data tersimpan terakhir (' + err.message + ')';
  }
}
loadLiveData();
